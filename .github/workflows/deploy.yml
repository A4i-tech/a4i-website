name: Deploy static site to Pages

on:
  push:
    branches: [a4i/main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard against files over GitHub's 100MB limit
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +99M -print)
          if [ -n "$big" ]; then
            echo "::error::File(s) exceed 100MB, will break the push — use a release asset instead:"
            echo "$big"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
