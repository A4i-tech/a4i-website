name: Deploy static site to Pages

on:
  push:
    branches: [a4i/main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard against files over GitHub's 100MB limit
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +99M -print)
          if [ -n "$big" ]; then
            echo "::error::File(s) exceed 100MB, will break the push — use a release asset instead:"
            echo "$big"
            exit 1
          fi

      # GitHub Pages ignores .assetsignore, so drop the Worker source here to
      # keep it out of the published site (it deploys separately via wrangler).
      - name: Exclude Worker source and repo config from the Pages artifact
        run: rm -rf workers wrangler.toml .gitleaks.toml README.md

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
