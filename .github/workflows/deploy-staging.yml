name: Deploy staging to Cloudflare Workers

on:
  push:
    branches: [a4i/staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard against files over Cloudflare Workers' 25MB per-file limit
        run: |
          big=$(find . -path ./.git -prune -o -type f -size +24M -print)
          if [ -n "$big" ]; then
            echo "::error::File(s) exceed Cloudflare's 25MB limit:"
            echo "$big"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
