name = "a4i-forms"
main = "src/index.js"
compatibility_date = "2026-08-24"

[vars]
# Origins allowed to POST to the Worker (comma separated). Add the staging
# workers.dev URL here if you want to test the forms there.
ALLOWED_ORIGINS = "https://a4i.iiitb.ac.in,https://www.a4i.iiitb.ac.in,https://a4i-staging.dev-a4i.workers.dev"
CONTACT_TO = "a4i@iiitb.ac.in"
# Must be an address on a domain verified in Resend.
MAIL_FROM = "A4I Website <noreply@a4i.iiitb.ac.in>"

[[d1_databases]]
binding = "DB"
database_name = "a4i-forms"
# Filled in by: wrangler d1 create a4i-forms
database_id = "cb81906d-1ac3-47b1-99af-074324d0f50d"

# Secrets (set with `wrangler secret put <NAME>`, never commit):
#   RESEND_API_KEY   - API key for sending the contact email
#   RECAPTCHA_SECRET - optional; enables server-side reCAPTCHA v3 verification
