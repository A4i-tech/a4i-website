name = "a4i-forms"
main = "src/index.js"
compatibility_date = "2026-08-24"

[vars]
# Origins allowed to POST to the Worker (comma separated). Add the staging
# workers.dev URL here if you want to test the forms there.
ALLOWED_ORIGINS = "https://a4i.iiitb.ac.in,https://www.a4i.iiitb.ac.in,https://a4i-staging.dev-a4i.workers.dev"
CONTACT_TO = "a4i@iiitb.ac.in"
# Plain address (the display name "A4I Website" is added in code). Must be on a
# domain verified as a sending domain in Mailtrap Email Sending (not Sandbox).
MAIL_FROM = "noreply@a4i-lab.in"

# Per-IP rate limit, applied separately to /contact and /newsletter in src/index.js
# (5 requests per 60s). Counters are per Cloudflare location and eventually
# consistent, so this is a flood guard, not exact accounting.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[d1_databases]]
binding = "DB"
database_name = "a4i-forms"
# Filled in by: wrangler d1 create a4i-forms
database_id = "cb81906d-1ac3-47b1-99af-074324d0f50d"

# Secrets (set with `wrangler secret put <NAME>`, never commit):
#   MAILTRAP_API_KEY - API token for sending the contact email (Mailtrap Email Sending)
#   RECAPTCHA_SECRET - REQUIRED; server-side reCAPTCHA v3 verification. Without it
#                      the Worker rejects every submission (503).
